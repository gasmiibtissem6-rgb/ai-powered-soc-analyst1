services:
  postgres:
    image: postgres:16
    container_name: soc-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


  redis:
    image: redis:7-alpine
    container_name: soc-redis
    restart: unless-stopped

    volumes:
      - redis_data:/data

    command:
      - redis-server
      - --appendonly
      - "yes"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5



  qdrant:
    image: qdrant/qdrant:v1.15.4
    container_name: soc-qdrant
    restart: unless-stopped

    volumes:
      - qdrant_data:/qdrant/storage

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'echo > /dev/tcp/127.0.0.1/6333'"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


  vault:
    image: hashicorp/vault:1.20
    container_name: soc-vault
    restart: unless-stopped

    cap_add:
      - IPC_LOCK

    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID}
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"

    command: server -dev

    ports:
      - "8200:8200"


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: soc-backend
    restart: unless-stopped

    env_file:
      - ./backend/.env

    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN_ID}
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_ISSUER: http://localhost:8080/realms/soc
      KEYCLOAK_REALM: soc
      KEYCLOAK_CLIENT_ID: soc-backend
    ports:
      - "8000:8000"

    volumes:
      - ./backend:/app
      - ./data:/data

    networks:
      - default
      - shuffle

    labels:
      - "traefik.enable=true"

      - "traefik.http.routers.soc-api.rule=Host(`soc.local`)"
      - "traefik.http.routers.soc-api.entrypoints=websecure"
      - "traefik.http.routers.soc-api.tls=true"

      - "traefik.http.services.soc-api.loadbalancer.server.port=8000"

      - "traefik.http.routers.soc-api-http.rule=Host(`soc.local`)"
      - "traefik.http.routers.soc-api-http.entrypoints=web"
      - "traefik.http.routers.soc-api-http.middlewares=https-redirect"

      - "traefik.http.middlewares.https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.https-redirect.redirectscheme.permanent=true"

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

      vault:
        condition: service_started


  prometheus:
    image: prom/prometheus:latest
    container_name: soc-prometheus
    restart: unless-stopped

    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    ports:
      - "9090:9090"

    depends_on:
      - backend


  grafana:
    image: grafana/grafana:latest
    container_name: soc-grafana
    restart: unless-stopped

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin

    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro

    ports:
      - "3000:3000"

    depends_on:
      - prometheus


  keycloak:
    image: quay.io/keycloak/keycloak:26.3.3
    container_name: soc-keycloak
    restart: unless-stopped

    command: start-dev

    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}

    volumes:
      - keycloak_data:/opt/keycloak/data

    ports:
      - "8080:8080"


  traefik:
    image: traefik:v3.6
    container_name: soc-traefik
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./infrastructure/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./infrastructure/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - ./infrastructure/traefik/certs:/certs:ro

    depends_on:
      - backend


volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  keycloak_data:
  qdrant_data:

networks:
  shuffle:
    external: true
    name: shuffle-soar_shuffle
