version: "3.9"

services:

  postgres:
    image: postgres:16

    container_name: soc-postgres

    restart: always

    environment:
      POSTGRES_DB: soc_db
      POSTGRES_USER: soc_admin
      POSTGRES_PASSWORD: soc_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: