name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ci_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d ci_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install CPU-only PyTorch
        run: pip install --index-url https://download.pytorch.org/whl/cpu torch

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Run database migrations
        env:
          SECRET_KEY: ci-test-secret-key
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 30
          SOC_INGESTION_API_KEY: ci-ingestion-test-key
          DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/ci_db
          GROQ_API_KEY: ci-groq-placeholder
          ABUSEIPDB_API_KEY: ci-abuseipdb-placeholder
          VIRUSTOTAL_API_KEY: ci-virustotal-placeholder
          OTX_API_KEY: ci-otx-placeholder
        run: alembic upgrade head

      - name: Run backend tests
        env:
          SECRET_KEY: ci-test-secret-key
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 30
          SOC_INGESTION_API_KEY: ci-ingestion-test-key
          DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/ci_db
          GROQ_API_KEY: ci-groq-placeholder
          ABUSEIPDB_API_KEY: ci-abuseipdb-placeholder
          VIRUSTOTAL_API_KEY: ci-virustotal-placeholder
          OTX_API_KEY: ci-otx-placeholder
        run: python -m pytest -q

  frontend:
    name: Frontend Lint and Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend lint
        run: npm run lint

      - name: Build frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_KEYCLOAK_URL: http://localhost:8080
          NEXT_PUBLIC_KEYCLOAK_REALM: soc
          NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: soc-frontend
        run: npm run build