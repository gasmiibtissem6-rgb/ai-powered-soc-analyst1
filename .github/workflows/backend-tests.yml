name: Backend Tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test-backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install CPU-only PyTorch
        run: pip install --index-url https://download.pytorch.org/whl/cpu torch

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run backend tests
        env:
          SECRET_KEY: ci-test-secret-key
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 30
          SOC_INGESTION_API_KEY: ci-ingestion-test-key
          DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/ci_db
          GROQ_API_KEY: ci-groq-placeholder
          ABUSEIPDB_API_KEY: ci-abuseipdb-placeholder
        run: python -m pytest -q
